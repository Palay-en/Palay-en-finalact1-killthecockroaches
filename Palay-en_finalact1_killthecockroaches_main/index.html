<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1E293B" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/img/icon.png" />
  <link rel="icon" type="image/png" href="assets/img/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Luckiest+Guy&display=swap');

    * {
      font-family: 'Josefin Sans', sans-serif;
    }

    #gameArea {
      cursor: url('assets/img/slipper-cursor.png') 50 50, auto;
    }

    #gameArea .cockroach:hover {
      cursor: url('assets/img/slipper-cursor.png') 50 50, auto;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    .animate-pulse {
      animation: pulse 1.5s infinite;
    }

    body {
      background: linear-gradient(to bottom, #8B4513, #A0522D);
      color: #F5DEB3;
    }

    #gameArea {
      background-color: #D2B48C;
      border-color: #8B4513;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    button {
      background-color: #A0522D;
      border-color: #8B4513;
      color: #F5DEB3;
    }

    button:hover {
      background-color: #8B4513;
      color: #FFF8DC;
    }

    .text-title {
      color: #F5DEB3;
      font-family: 'Luckiest Guy', sans-serif;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    #startScreen, #gameOverScreen, #offlineScreen {
      background: rgba(139, 69, 19, 0.9);
    }

    #speedUpNotification {
      background-color: #DEB887;
      color: #8B4513;
    }
  </style>
  <title>Kill the Cockroaches!</title>
</head>

<body class="bg-gradient-to-b from-gray-900 to-gray-800 text-gray-200 font-sans">
  <div class="container mx-auto p-4">
    <div class="flex flex-col items-center mb-4">
      <h1 class="text-5xl text-title mb-2">Kill the Cockroaches!</h1>
      <div class="flex space-x-4">
        <p class="text-lg font-bold text-red-400 flex items-center">
          <i class="fas fa-clock mr-2"></i> <span id="timer">90</span> sec
        </p>
        <p class="text-lg font-bold text-green-400 flex items-center">
          <i class="fas fa-skull-crossbones mr-2"></i> <span id="score">0</span> kills
        </p>
        <button id="muteBtn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-bold py-2 px-4 rounded flex items-center">
          <i id="muteBtnIcon" class="fas fa-volume-up mr-2"></i> Mute
        </button>
      </div>
    </div>
    <div id="startScreen"
      class="fixed inset-0 flex flex-col justify-center items-center bg-gray-900 bg-opacity-90 text-gray-200 z-50">
      <h1 class="text-5xl font-extrabold mb-6 text-blue-400 animate-bounce text-center">Kill the Cockroaches!</h1>
      <p class="text-lg mb-6 text-gray-400">Are you ready to smash some bugs?</p>
      <button id="startBtn"
        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition-transform transform hover:scale-110">
        <i class="fas fa-play"></i> Start Game
      </button>
    </div>
    <div id="gameArea"
      class="bg-gray-200 rounded-lg shadow-lg relative w-full h-[76vh] overflow-hidden border-4 border-blue-500">
      <div id="speedUpNotification"
        class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-yellow-400 text-black font-bold py-2 px-4 rounded-lg shadow-lg">
        ⚡ Speed Up!
      </div>
    </div>
    <div id="gameOverScreen"
      class="hidden fixed inset-0 flex flex-col justify-center items-center bg-gray-900 bg-opacity-90 text-gray-200 z-50">
      <h2 class="text-4xl font-extrabold mb-4 text-red-500"><i class="fa-solid fa-hourglass-end"></i> Game Over!</h2>
      <p class="text-lg mb-6">Cockroaches Killed: <span id="finalScore" class="text-blue-400 font-bold">0</span></p>
      <button id="playAgainBtn"
        class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition-transform transform hover:scale-110">
        <i class="fas fa-redo"></i> Play Again
      </button>
    </div>
    <div id="offlineNotification" class="hidden mt-4 bg-red-500 text-white font-bold py-2 px-4 rounded-lg text-center">
      <p>No Internet Connection Detected. Please reconnect!</p>
    </div>
    <div id="offlineScreen"
      class="hidden fixed inset-0 flex flex-col justify-center items-center bg-gray-900 bg-opacity-90 text-gray-200 z-50">
      <h5 class="text-xl font-bold mb-4">No Internet Connection Detected</h5>
      <p>Please reconnect to continue playing.</p>
    </div>
    <button id="installBtn" hidden
      class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg">
      <i class="fas fa-download"></i> Install Game
    </button>
    <audio id="backgroundMusic" src="assets/sounds/background-music.mp3" loop></audio>
    <audio id="squishSound" src="assets/sounds/squish.mp3"></audio>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <script src="assets/js/service-worker.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/restart.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/timer.js"></script>
  <script src="assets/js/installation.js"></script>
  <script src="assets/js/network.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('assets/js/service-worker.js')
        .then((registration) => console.log('Service Worker registered with scope:', registration.scope))
        .catch((error) => console.error('Service Worker registration failed:', error));
    }
  </script>
</body>

</html>
